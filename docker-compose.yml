services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    environment:
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:3010,http://127.0.0.1:3010
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
